<!DOCTYPE html>
<html>
    <head>
        <title> 
            Product list
        </title>
        <style>
            table{width: 60%; border-collapse: collapse; margin-top: 20px; font-family: Arial, Helvetica, sans-serif; }
            th, td {border: 1px solid #dddddd; text-align: left; padding: auto;}
        </style>
    </head>
    <body>
        <h1>Product Catalog </h1>
        <table>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>stock</th>
                <th>Descriptin</th>
            </tr>
            {% for p in products %}
                <tr>
                <td><strong>{{p.name}}</strong></td>
                <td><strong>{{p.price}}</strong></td>
                <td><strong>{{p.stock}}</strong></td>
                <td><strong>{{p.description}}</strong></td>
             </tr>
              {% endfor %}

        </table>
       </body>
</html>
